name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Keep bootstrap-installed binaries first in every shell step.
      PATH: /usr/local/bin:/usr/bin:/bin
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Cache shared pnpm store and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/ms-playwright
          key: lamp-linux-${{ runner.arch }}-${{ hashFiles('scripts/agent-bootstrap.sh', 'pnpm-lock.yaml', 'package.json') }}
      # Base's rer CLI starts a local server only with 15 GiB free on the checkout
      # and temporary volumes (tests/e2e/rer-journey.test.mjs); hosted runners
      # start with less.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / "$RUNNER_TEMP"
      - name: Prepare verification logs
        run: mkdir -p "$RUNNER_TEMP/lamp-verification"
      - name: Bootstrap and verify
        run: |
          { bash scripts/agent-bootstrap.sh && pnpm verify; } 2>&1 | tee "$RUNNER_TEMP/lamp-verification/verify.log"
      # Run browser suites even when an earlier verifier gate fails, so the
      # first PR run records their actual results for the owning lane.
      - name: Publishing browser
        if: ${{ !cancelled() }}
        run: pnpm run test:publishing-browser 2>&1 | tee "$RUNNER_TEMP/lamp-verification/publishing-browser.log"
      - name: UI interactions
        if: ${{ !cancelled() }}
        run: pnpm run test:ui-interactions 2>&1 | tee "$RUNNER_TEMP/lamp-verification/ui-interactions.log"
      - name: Maintenance timezone
        if: ${{ !cancelled() }}
        run: pnpm run test:maintenance-timezone 2>&1 | tee "$RUNNER_TEMP/lamp-verification/maintenance-timezone.log"
      - name: Autosave integrity
        if: ${{ !cancelled() }}
        run: pnpm run test:autosave-integrity 2>&1 | tee "$RUNNER_TEMP/lamp-verification/autosave-integrity.log"
      - name: Public contract browser
        if: ${{ !cancelled() }}
        run: pnpm run test:public 2>&1 | tee "$RUNNER_TEMP/lamp-verification/public.log"
      - name: Accessibility browser
        if: ${{ !cancelled() }}
        run: pnpm run test:accessibility 2>&1 | tee "$RUNNER_TEMP/lamp-verification/accessibility.log"
      - name: Baseline browser
        if: ${{ !cancelled() }}
        run: pnpm run test:baseline 2>&1 | tee "$RUNNER_TEMP/lamp-verification/baseline.log"
      - name: Built Start runtime browser
        if: ${{ !cancelled() }}
        run: pnpm run test:start-runtime 2>&1 | tee "$RUNNER_TEMP/lamp-verification/start-runtime.log"
      # Record the documented visual verifier, including its early source gates.
      # Also run its local browser probes independently after a real build.
      - name: Visual edit verifier
        if: ${{ !cancelled() }}
        run: pnpm verify:visual 2>&1 | tee "$RUNNER_TEMP/lamp-verification/visual-verifier.log"
      - name: Build for visual edit browser probes
        id: visual-build
        if: ${{ !cancelled() }}
        run: pnpm run build 2>&1 | tee "$RUNNER_TEMP/lamp-verification/visual-build.log"
      - name: Compiled visual edit browser
        if: ${{ !cancelled() && steps.visual-build.outcome == 'success' }}
        run: node --test --test-name-pattern='compiled visual edits' tests/e2e/publishing-browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/lamp-verification/visual-browser.log"
      - name: Compiled visual edit heading probe
        if: ${{ !cancelled() && steps.visual-build.outcome == 'success' }}
        env:
          RER_VISUAL_HEADING_PROBE: '1'
        run: node --test --test-name-pattern='compiled visual edits' tests/e2e/publishing-browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/lamp-verification/visual-heading-probe.log"
      - name: Retain actual verification results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lamp-verification/
          if-no-files-found: error
          retention-days: 7
