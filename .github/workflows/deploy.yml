name: Build Lamp independent release
on:
  workflow_dispatch:
    inputs:
      lamp_status:
        description: Deploy Lamp's own status installation instead of building a release
        type: boolean
        default: false
      lamp_status_outside_secret_change:
        description: With lamp_status, SECRET_NAME=<Worker version id> of a secret written on the status Worker outside its workflow, to record first
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    if: ${{ !inputs.lamp_status }}
    uses: runeditrun/delivery/.github/workflows/trusted-build.yml@86c8b37399c901bffd9a240dbd1148a65ec83b34
    with:
      installation_id: ${{ vars.RER_INSTALLATION_ID }}
      broker_url: ${{ vars.RER_BROKER_URL }}
      environment: production
      build_profile: project
      verification_profile: full
      artifact_file: lamp-worker-artifact.json
  status:
    if: inputs.lamp_status
    uses: ./.github/workflows/deploy-status.yml
    with:
      outside_secret_change: ${{ inputs.lamp_status_outside_secret_change }}
    secrets: inherit
