name: Run demo
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      proof:
        description: Separate test-only demo with published Turnstile test keys
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: run-demo
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.RUN_DEMO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: run-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - name: Deploy isolated demo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DEMO_PROOF: ${{ inputs.proof }}
        run: |
          authorized_account=b20c0ca9cab0c2b70e13d7cf724b89bd
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ "$CLOUDFLARE_ACCOUNT_ID" != "$authorized_account" ]; then
            echo 'Configured account differs from the authorized RunEditRun account.' >&2
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID="$authorized_account"
          environment=production
          if [ "$DEMO_PROOF" = true ]; then
            environment=demo-proof
            export TURNSTILE_SITE_KEY=1x00000000000000000000AA
            export TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
            node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='deploy-demo.json', value=JSON.parse(readFileSync(path,'utf8'));
          value.domain='test.run-lamp.com';
          value.settings.LAMP_APP_HOST='demo.test.run-lamp.com';
          value.settings.LAMP_PAGE_HOST='page.demo.test.run-lamp.com';
          writeFileSync(path,JSON.stringify(value,null,2)+'\n');
          JS
          fi
          pnpm exec rer deploy --demo --environment "$environment"
      - name: Public readback
        run: |
          domain=demo.$(node -p "require('./deploy-demo.json').domain")
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/")" = 200 ] && break
            sleep 10
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/")" = 200
          ! curl -s -D - -o /dev/null "https://$domain/" | grep -qi '^set-cookie:'
