name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        type: string
        default: push

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      shards: ${{ steps.plan.outputs.shards }}
      coverage: ${{ steps.plan.outputs.coverage }}
      tier: ${{ steps.plan.outputs.tier }}
      readers: ${{ steps.plan.outputs.readers }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate reusable workflow permissions and Base lifecycle helpers
        run: |
          node scripts/verify-ci.mjs --check-workflows
          node --check scripts/verify-plan.mjs
          node --check scripts/verify-evidence.mjs
          node --check scripts/verify-light.mjs
      - id: plan
        name: Select coverage with Base evidence and Lamp's existing partitions
        env:
          TIER: ${{ inputs.tier || 'push' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/plan.mjs

  build:
    needs: plan
    if: needs.plan.outputs.coverage == 'full' && needs.plan.outputs.has_shards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: lamp-ubuntu24-temp-pnpm-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install pinned tools and dependencies
        run: bash scripts/ci/bootstrap.sh
      - name: Build the production Worker once
        env:
          LAMP_VERIFY_SHARD: build
          LAMP_VERIFICATION_DIRECTORY: ${{ runner.temp }}/lamp-verification/ci-shards
        run: |
          pnpm run verify:app
          tar -czf "$RUNNER_TEMP/lamp-built-worker.tar.gz" dist .wrangler/deploy/config.json
      - name: Retain commit-bound build completion
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-shard-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: ${{ runner.temp }}/lamp-verification/ci-shards/build.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-build-${{ github.sha }}
          path: ${{ runner.temp }}/lamp-built-worker.tar.gz
          if-no-files-found: error
          retention-days: 1

  shards:
    name: shards (${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.coverage == 'full' && needs.plan.outputs.has_shards == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare runner-owned browser and apt caches
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: lamp-ubuntu24-temp-pnpm-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Cache Chromium and its system packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: lamp-ubuntu24-temp-chromium-${{ runner.arch }}-${{ hashFiles('scripts/ci/bootstrap.sh', 'pnpm-lock.yaml') }}
      # Base requires 15 GiB free before starting native local servers.
      - name: Reserve disk for native runtime journeys
        if: contains(fromJSON('["ownership", "demo", "imports", "portability"]'), matrix.shard)
        run: |
          # Leave room for bootstrap without deleting every toolchain on every
          # machine. The other shards do not start a Base-managed server.
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
          df -h / "$RUNNER_TEMP"
      - name: Prepare verification logs
        run: mkdir -p "$RUNNER_TEMP/lamp-verification"
      - name: Install pinned tools and dependencies
        run: bash scripts/ci/bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/lamp-verification/bootstrap.log"
      - name: Install Chromium only for browser shards
        # These shards exercise source, API and contract doors without a browser.
        if: matrix.shard != 'portability'
        run: |
          set -euo pipefail
          bash scripts/ci/chromium.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lamp-build-${{ github.sha }}
          path: ${{ runner.temp }}/lamp-build
      - name: Restore the shared production Worker
        run: tar -xzf "$RUNNER_TEMP/lamp-build/lamp-built-worker.tar.gz"
      - name: Verify this product shard
        env:
          LAMP_VERIFY_SHARD: ${{ matrix.shard }}
          LAMP_VERIFICATION_DIRECTORY: ${{ runner.temp }}/lamp-verification/ci-shards
          LAMP_BASELINE_REPORT: ${{ runner.temp }}/lamp-verification/baseline-report.json
        run: |
          # rer verify adds Base's hosted-output and hydration checks after the
          # runtime shard has built and exercised the actual production Worker.
          if [ "$LAMP_VERIFY_SHARD" = runtime ]; then
            pnpm verify 2>&1 | tee "$RUNNER_TEMP/lamp-verification/shard.log"
          else
            pnpm run verify:app 2>&1 | tee "$RUNNER_TEMP/lamp-verification/shard.log"
          fi
      - name: Retain commit-bound shard completion
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lamp-verification/ci-shards/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual verification logs and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/lamp-verification/
            test-results/
          if-no-files-found: error
          retention-days: 7

  light:
    needs: plan
    if: needs.plan.outputs.coverage == 'light'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: lamp-ubuntu24-temp-pnpm-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: bash scripts/ci/bootstrap.sh
      - name: Check source integrity, reviewed document readers and the run site
        env:
          LIGHT_READERS: ${{ needs.plan.outputs.readers }}
        run: node scripts/ci/light.mjs

  full-push-proof:
    needs: [plan, build, shards]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.plan.outputs.tier == 'push' && needs.plan.outputs.coverage == 'full' && needs.build.result == 'success' && needs.shards.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: test '${{ needs.build.result }}:${{ needs.shards.result }}' = success:success

  # Preserve the stable required-check name while requiring every planned shard.
  verify:
    needs: [plan, build, shards, light, full-push-proof]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require a successful plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: needs.plan.outputs.coverage == 'full' && needs.plan.outputs.has_shards == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.plan.outputs.coverage == 'full' && needs.plan.outputs.has_shards == 'true'
        with:
          pattern: lamp-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/lamp-verification/ci-shards
          merge-multiple: false
      - name: Require every planned command to succeed on this commit
        if: ${{ always() && needs.plan.outputs.coverage == 'full' && needs.plan.outputs.has_shards == 'true' }}
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
          LAMP_VERIFICATION_DIRECTORY: ${{ runner.temp }}/lamp-verification/ci-shards
        run: |
          node scripts/verification/aggregate.mjs
          test "$SHARDS_RESULT" = success
      - name: Retain combined verification verdict
        if: ${{ always() && needs.plan.outputs.coverage == 'full' && needs.plan.outputs.has_shards == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lamp-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lamp-verification/ci-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Require the selected coverage and its proof
        if: ${{ always() }}
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.shards.result }}
          LIGHT: ${{ needs.light.result }}
          PUSH_PROOF: ${{ needs.full-push-proof.result }}
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          HAS_SHARDS: ${{ needs.plan.outputs.has_shards }}
          SKIP: ${{ needs.plan.outputs.skip }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          case "$PUSH_PROOF" in failure|cancelled) exit 1 ;; esac
          case "$COVERAGE" in
            reuse) test "$SKIP" = true && test "$BUILD:$SHARDS:$LIGHT" = skipped:skipped:skipped ;;
            light) test "$SKIP" = false && test "$BUILD:$SHARDS:$LIGHT" = skipped:skipped:success ;;
            full)
              test "$SKIP:$LIGHT" = false:skipped
              if [ "$HAS_SHARDS" = true ]; then
                test "$BUILD:$SHARDS" = success:success
              else
                test "$BUILD:$SHARDS" = skipped:skipped
              fi
              ;;
            *) exit 1 ;;
          esac
