name = "lamp"
main = "../src/server.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[triggers]
# Scheduled publication and maintenance transitions have a sixty-second SLA.
crons = ["* * * * *"]

[assets]
binding = "ASSETS"
# Host isolation applies to every request, including misses and generated assets.
run_worker_first = true

[vars]
# Local development intentionally uses one hostname for both surfaces. A real
# deployment can set distinct hostnames to enforce the public/operator split.
LAMP_PAGE_HOST = "127.0.0.1"
LAMP_APP_HOST = "127.0.0.1"
# Local sample identity; without a provider key, mail requests fail explicitly.
# Deployment setup supplies the buyer's verified sender.
MAIL_FROM_ADDRESS = "lamp@localhost.invalid"

[[d1_databases]]
binding = "DB"
database_name = "lamp-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations/core"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "lamp-local-snapshots"

[[queues.producers]]
binding = "JOBS"
queue = "lamp-local-jobs"

[[queues.consumers]]
queue = "lamp-local-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

[[durable_objects.bindings]]
name = "SNAPSHOT_CACHE"
class_name = "SnapshotCache"

[[migrations]]
tag = "snapshot-cache-v1"
new_sqlite_classes = ["SnapshotCache"]
