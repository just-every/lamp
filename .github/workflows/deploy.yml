name: Build Lamp independent release
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  release:
    uses: runeditrun/delivery/.github/workflows/trusted-build.yml@bf7a25abb44bec1457a7bc738ff63921d90fb52e
    with:
      installation_id: ${{ vars.RER_INSTALLATION_ID }}
      broker_url: ${{ vars.RER_BROKER_URL }}
      environment: production
      build_profile: project
      verification_profile: full
      artifact_file: lamp-worker-artifact.json
